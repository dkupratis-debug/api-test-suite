# Mocked lint and tests run on every push and pull request.
# The live job calls JSONPlaceholder and runs only when someone starts
# the workflow by hand (Actions tab -> CI -> Run workflow).

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Ruff and mocked pytest (${{ matrix.python-version }})
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package and test tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Run mocked tests
        run: python -m pytest

  live:
    name: Live JSONPlaceholder tests
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the package and test tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run live tests
        run: python -m pytest --live -m live
